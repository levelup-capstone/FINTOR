services:
  # 1. 백엔드 컨테이너 (FastAPI) - DB는 Supabase 사용
  backend:
    container_name: fintor-backend
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always

  # 2. 프론트엔드 컨테이너 (React/Vite)
  frontend:
    container_name: fintor-frontend
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always