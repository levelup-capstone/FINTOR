name: Deploy to EC2

on:
  push:
    branches: [release]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/capstone7
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/levelup-capstone/capstone7.git release
            git checkout release
            git reset --hard FETCH_HEAD
            docker compose down
            docker compose up -d --build
